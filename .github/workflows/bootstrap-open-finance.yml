name: bootstrap-open-finance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-open-finance.yml"

permissions:
  contents: write

jobs:
  import-upstream:
    if: github.repository == 'chrisj500/Aubrieta-finance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aubrieta
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Clone pinned Open Finance snapshot
        run: |
          git clone --filter=blob:none https://github.com/DeseretSaint/open-finance.git /tmp/open-finance
          git -C /tmp/open-finance checkout 94d4a7e8ea875d346f5fd3d231ae1a022ddb6a26

      - name: Import application snapshot
        run: |
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='README.md' \
            /tmp/open-finance/ ./

          mkdir -p docs/upstream
          cp /tmp/open-finance/README.md docs/upstream/OPEN_FINANCE_README.md

          cat > UPSTREAM.md <<'UPSTREAM'
          # Upstream provenance

          Aubrieta began from a source snapshot of the MIT-licensed
          [DeseretSaint/open-finance](https://github.com/DeseretSaint/open-finance) project.

          - Upstream repository: `DeseretSaint/open-finance`
          - Imported commit: `94d4a7e8ea875d346f5fd3d231ae1a022ddb6a26`
          - Upstream version at import: `v0.3.49`
          - License: MIT (see `LICENSE`)

          Aubrieta is maintained as an independent open-source personal-finance project.
          Upstream changes will be selectively incorporated rather than automatically merged.
          UPSTREAM

      - name: Commit imported baseline
        run: |
          git config user.name "Aubrieta Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import"
            exit 0
          fi
          git commit -m "vendor: import Open Finance v0.3.49 baseline"
          git push origin HEAD:main
