name: remediate-security-baseline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remediate-security-baseline.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Patch vulnerable production dependencies
        run: |
          pnpm up next@15.5.25 nodemailer@9.1.1 @modelcontextprotocol/sdk@1.30.1 sharp@0.35.4

      - name: Production dependency audit
        run: pnpm audit --prod

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migration bundle parity
        run: pnpm check:migrations

      - name: Tests
        env:
          ENCRYPTION_KEY: ci-test-encryption-key
          AUTH_SECRET: ci-test-auth-secret
        run: pnpm test

      - name: Build
        env:
          ENCRYPTION_KEY: build-time-dummy
          AUTH_SECRET: build-time-dummy
        run: pnpm build

      - name: Commit patched dependency baseline
        run: |
          git config user.name "Aubrieta Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "fix(security): patch imported dependency vulnerabilities"
          git push origin HEAD:main
