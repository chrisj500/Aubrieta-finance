name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: external-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # External fork code stays on GitHub-hosted infrastructure. Trusted
    # same-repository PRs and main pushes are handled by trusted-ci.yml.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migration bundle parity
        run: pnpm check:migrations

      - name: Unit and integration tests
        env:
          ENCRYPTION_KEY: ci-test-encryption-key
          AUTH_SECRET: ci-test-auth-secret
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          ENCRYPTION_KEY: build-time-dummy
          AUTH_SECRET: build-time-dummy

      - name: Service worker artifact
        run: |
          test -s public/sw.js
          grep -q "self" public/sw.js

      - name: Dependency audit
        run: pnpm audit --prod

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
